[project]
name = "doar-v3"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "pandas>=2.2"]
cv = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
ingest = ["pypdf>=4"]
ui = ["streamlit>=1.36,<2"]
deep = ["torch>=2.2,<3", "torchvision>=0.17,<1"]
embeddings = ["open-clip-torch>=2.26,<3"]
# Phase 2C.4: open-vocabulary detector benchmark (Grounding DINO, OWLv2,
# Florence-2 via `transformers`; YOLO-World via `ultralytics`). Heavy,
# optional, local-only -- never required by CI (ci.yml installs only
# cv/dev/ml). einops/accelerate are Florence-2's own documented runtime
# dependencies (custom modeling code + device_map loading), not a DOAR
# choice.
phase2c4 = ["transformers>=4.40,<5", "accelerate>=0.30,<1", "einops>=0.7,<1", "ultralytics>=8.1,<9"]

[tool.ruff.lint]
# Explicit, pinned to ruff's classic default selection (pycodestyle errors +
# pyflakes). Without this, a floor-only `ruff>=0.5` install resolves to
# whatever ruff considers "default" at install time -- and that default grew
# far beyond E4/E7/E9/F in newer ruff releases (isort, bugbear, bandit,
# pylint, ...), which is not a change this codebase's per-file-ignores
# comment ("no rule is weakened globally") ever anticipated or was written
# against. Pinning the selection, not the ruff version, keeps `pip install
# -e ".[cv,dev]"` reproducible across a fresh CI install and a long-lived
# local .venv without freezing the tool itself.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# main.py and tests bootstrap sys.path before importing the (editable) package,
# which legitimately requires imports after that statement. This targets only
# E402 for those files; no rule is weakened globally.
"main.py" = ["E402"]
"tests/**" = ["E402"]
